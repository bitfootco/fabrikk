services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fabrikk_dev
      POSTGRES_USER: fabrikk
      POSTGRES_PASSWORD: fabrikk
    ports:
      - '5432:5432'
    volumes:
      - fabrikk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fabrikk -d fabrikk_dev']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  fabrikk_pgdata:
